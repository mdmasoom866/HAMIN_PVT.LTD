<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HAMIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a0a0a;
            --secondary: #ffffff;
            --accent: #287A74;
            --accent-light: #4a9b95;
            --gray-light: #f8f9fa;
            --gray-dark: #374151;
            --text-primary: #0a0a0a;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --error: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #f8f9fa;
                --secondary: #0a0a0a;
                --accent: #287A74;
                --accent-light: #4a9b95;
                --gray-light: #1f2937;
                --gray-dark: #9ca3af;
                --text-primary: #f8f9fa;
                --text-secondary: #9ca3af;
                --border-color: #374151;
                color-scheme: dark;
            }
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            background: linear-gradient(135deg, var(--primary) 0%, #1a2a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: var(--secondary);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            color: var(--secondary);
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .login-form {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .form-group label .required {
            color: var(--error);
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--gray-light);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(40, 122, 116, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: var(--secondary);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 122, 116, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 122, 116, 0.4);
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .login-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef2f2;
            color: var(--error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .login-loader {
            display: none;
            text-align: center;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--secondary);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                border-radius: 0;
            }

            .login-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Student Login Portal</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="enrollment">Enrollment Number <span class="required">*</span></label>
                    <input type="text" id="enrollment" name="enrollment" placeholder="Enter your 12-digit enrollment number" maxlength="12" pattern="[0-9]{12}" required>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span id="loginText">Login</span>
                    <div class="login-loader" id="loginLoader">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const enrollment = document.getElementById('enrollment').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('errorMessage');
            const loginText = document.getElementById('loginText');
            const loginLoader = document.getElementById('loginLoader');

            // Validate enrollment number is 12 digits
            const enrollmentRegex = /^[0-9]{12}$/;
            if (!enrollmentRegex.test(enrollment)) {
                showError('Please enter a valid 12-digit enrollment number.');
                return;
            }

            // Basic validation
            if (!password) {
                showError('Please enter your password.');
                return;
            }

            // Show loading state
            loginText.style.display = 'none';
            loginLoader.style.display = 'block';

            // Simulate login process (in production, this would be an API call)
            setTimeout(function() {
                // Demo validation - in real app, check against database
                if (password.length >= 6) {
                    // Successful login
                    const userData = {
                        enrollment: enrollment,
                        loginTime: new Date().toISOString()
                    };

                    // Store user data
                    try {
                        if (rememberMe) {
                            localStorage.setItem('hamin_user_data', JSON.stringify(userData));
                        } else {
                            sessionStorage.setItem('hamin_user_data', JSON.stringify(userData));
                        }

                        // Update login status
                        localStorage.setItem('hamin_logged_in', 'true');

                        // Redirect to home page
                        window.location.href = 'index.html';
                    } catch (err) {
                        loginText.style.display = 'block';
                        loginLoader.style.display = 'none';
                        showError('Could not save login data. Please try again.');
                    }
                } else {
                    // Invalid credentials
                    loginText.style.display = 'block';
                    loginLoader.style.display = 'none';
                    showError('Invalid password. Password must be at least 6 characters.');
                }
            }, 1000);
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(function() {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Clear error when user types
        document.getElementById('enrollment').addEventListener('input', function() {
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').classList.remove('show');
        });

        // Check if already logged in
        window.addEventListener('load', function() {
            const isLoggedIn = localStorage.getItem('hamin_logged_in') === 'true' ||
                              sessionStorage.getItem('hamin_logged_in') === 'true';

            if (isLoggedIn) {
                // User already logged in, redirect to home
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
